services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../:/app
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sia_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solo-desarrollo}
    volumes:
      - sia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sia_user} -d ${POSTGRES_DB:-sia_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sia_postgres_data:
